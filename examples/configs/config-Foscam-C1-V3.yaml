# Foscam C1 V3 on its main stream only: the camera's videoSub stream sends no video, so there is
# no sub_url and the main stream feeds recording, the live preview and detection.
# Credentials come from environment variables (see .env):
#   CAM_USER=admin
#   CAM_PASS=your-camera-password
# rtsp-warden expands ${NAME} references in config.yaml at load time.
cameras:
  - name: front
    main_url: "rtsp://${CAM_USER}:${CAM_PASS}@192.168.1.72:554/videoMain"

    record:
      enabled: true
      output_dir: ./recordings

      main:
        enabled: true
        container: ts
        chunk_seconds: 300
        rtsp_transport: tcp

    retention:
      max_days: 7
      max_gb: 50
      keep_last_n: 10
      cleanup_interval_seconds: 300

    proxy:
      enabled: true
      mode: mjpeg         # mjpeg | rtsp
      stream: main        # main | sub (this camera has no usable sub stream)
      bind_host: 0.0.0.0
      port: 9001

      # RTSP (MediaMTX) options (mode=rtsp)
      path: live
      source_on_demand: true  # NOTE: best-effort; unified ingest publishes while running.

      # MJPEG options (mode=mjpeg)
      fps: 15
      scale_width: 0      # 0 disables scaling

    # Detection: motion on every tapped frame, YOLOX-s on 2 of the 5 frames per second.
    # The model (about 34 MB) downloads into runtime.models_dir on the first frame.
    detect_fps: 5
    detectors:
      - type: motion
        fps: 5
      - type: onnx
        model: yolox-s
        device: auto      # CUDA when the GPU build of onnxruntime is installed, else CPU
        fps: 2
        min_confidence: 0.5

    # Notifications (optional). The rule sends to the "phone" action, so also turn on the
    # actions example at the end of this file.
    # --- rules example: delete the leading "# " on the lines below to turn it on ---
    # rules:
    #   - name: person-any-time
    #     labels: [person]
    #     min_confidence: 0.6
    #     cooldown_seconds: 60
    #     clip: true
    #     actions: [phone]
    # --- end of rules example ---

runtime:
  ffmpeg_path: ffmpeg
  mediamtx_path: mediamtx
  ffmpeg_loglevel: warning
  workspace_dir: ./workspace

  auto_restart: true
  restart_backoff_min_s: 1
  restart_backoff_max_s: 60
  restart_backoff_factor: 2

  stderr_tail_lines: 200
  status_interval_s: 15

# Actions (optional). ntfy.sh topics are public: keep the topic a long random string in .env
# (NTFY_TOPIC=...), or use a server with access control and a token.
# --- actions example: delete the leading "# " on the lines below to turn it on ---
# actions:
#   - name: phone
#     type: ntfy
#     url: https://ntfy.sh
#     topic: ${NTFY_TOPIC}        # put NTFY_TOPIC=<long random string> in .env; ntfy.sh topics are public
#     token: ${NTFY_TOKEN}         # optional; put NTFY_TOKEN=... in .env
# --- end of actions example ---

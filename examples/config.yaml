# Minimal single-camera example. admin:admin below are placeholders, not credentials;
# see examples/configs/ for ${CAM_USER}/${CAM_PASS} environment references.
cameras:
  - name: front
    main_url: rtsp://admin:admin@192.168.1.50:554/Streaming/Channels/101
    sub_url: rtsp://admin:admin@192.168.1.50:554/Streaming/Channels/102

    record:
      enabled: true
      output_dir: ./recordings

      # Main stream: TS container (NVR-grade default)
      main:
        enabled: true
        container: ts
        chunk_seconds: 300
        rtsp_transport: tcp

      # Sub stream: TS is the NVR-grade default for both streams
      sub:
        enabled: true
        container: ts
        chunk_seconds: 300
        rtsp_transport: tcp

    retention:
      max_days: 7
      max_gb: 50
      keep_last_n: 10
      cleanup_interval_seconds: 300

    proxy:
      enabled: true
      mode: mjpeg         # mjpeg | rtsp
      stream: sub         # main | sub
      bind_host: 0.0.0.0
      port: 9001

      # RTSP (MediaMTX) options (mode=rtsp)
      path: live
      source_on_demand: true  # NOTE: currently best-effort; unified ingest publishes while running.

      # MJPEG options (mode=mjpeg)
      fps: 7
      scale_width: 0      # 0 disables scaling

    # Detection (optional). The example rule sends to the "phone" action, so also turn on
    # the actions example at the end of this file.
    # --- detection example: delete the leading "# " on the lines below to turn it on ---
    # detect_fps: 5                # frames per second sent to the detectors (0.5-30)
    # detectors:
    #   - type: motion
    #     fps: 5
    #   - type: onnx               # YOLOX; the model (about 34 MB) downloads on the first frame
    #     model: yolox-s           # yolox-nano for a small CPU
    #     device: auto             # auto | cuda | cpu
    #     fps: 2                   # at most detect_fps
    #     min_confidence: 0.5
    # rules:
    #   - name: person-any-time
    #     labels: [person]
    #     zones: []                # empty = any zone
    #     min_confidence: 0.6
    #     between: null            # or "22:00-06:00" (local time, may wrap midnight)
    #     cooldown_seconds: 60
    #     clip: true
    #     actions: [phone]
    # --- end of detection example ---

runtime:
  ffmpeg_path: ffmpeg
  mediamtx_path: mediamtx
  ffmpeg_loglevel: warning
  workspace_dir: ./workspace

  auto_restart: true
  restart_backoff_min_s: 1
  restart_backoff_max_s: 60
  restart_backoff_factor: 2

  stderr_tail_lines: 200
  status_interval_s: 15

# Actions (optional). ntfy.sh topics are public: keep the topic a long random string in .env
# (NTFY_TOPIC=...), or use a server with access control and a token.
# --- actions example: delete the leading "# " on the lines below to turn it on ---
# actions:
#   - name: phone
#     type: ntfy
#     url: https://ntfy.sh
#     topic: ${NTFY_TOPIC}        # put NTFY_TOPIC=<long random string> in .env; ntfy.sh topics are public
#     token: ${NTFY_TOKEN}         # optional; put NTFY_TOKEN=... in .env
# --- end of actions example ---

[project]
name = "rtsp-warden-wildlife"
version = "0.1.0"
description = "Trains the wildlife-yolox-s model for rtsp-warden (a tool, never part of the package)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  # YOLOX itself is a pinned source checkout in .yolox/ (see setup.sh): its setup.py needs
  # torch at build time, so it cannot be a normal dependency. These are its runtime needs.
  "loguru>=0.7",
  "tabulate>=0.9",
  "thop>=0.1.1",
  "ninja>=1.11",
  "psutil>=5.9",
  "tensorboard>=2.16",
  "pycocotools>=2.0.8",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "httpx>=0.28",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

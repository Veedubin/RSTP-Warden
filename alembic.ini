# Only the alembic CLI reads this file (for example `uv run alembic history` or
# `uv run alembic downgrade 0002_clips`). The app never does: rtsp_warden.db.schema builds its
# Alembic Config in code. The CLI migrates WARDEN_DB_URL, else the default SQLite file under
# $XDG_DATA_HOME (see rtsp_warden/db/engine.py). Migrations live inside the package.
[alembic]
script_location = rtsp_warden:migrations
path_separator = os

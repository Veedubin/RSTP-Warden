services:
  warden:
    build:
      context: .
      # Use the distroless Dockerfile (685 MB vs 1.21 GB).
      # Set to just "Dockerfile" for the larger Python 3.13-slim image.
      dockerfile: Dockerfile.distroless
    image: rtsp-warden:distroless
    # To use the larger slim image instead, comment out the `build` block above
    # and uncomment the next two lines:
    # image: rtsp-warden:latest
    # build: .
    container_name: rtsp-warden
    restart: unless-stopped
    ports:
      - "${WARDEN_HOST_PORT:-3333}:8080"   # Web UI on the host (WARDEN_HOST_PORT in .env overrides 3333)
      - "9001:9001"     # MJPEG proxy (optional; only if MJPEG proxy enabled)
    volumes:
      - ./config:/app/config                 # config.yaml + .env; the web UI writes here
      - ./recordings:/app/recordings          # persisted recordings
      - ./data:/app/data                      # SQLite DB lives here
    environment:
      # SQLite in the ./data mount; switch to Postgres by replacing this URL
      WARDEN_DB_URL: sqlite:////app/data/warden.db
      # WARDEN_DB_URL: postgresql+psycopg2://warden:warden@postgres:5432/warden
      # ONNX models download here on first use; inside ./data, so they survive rebuilds
      WARDEN_MODELS_DIR: /app/data/models
      # First-start admin password (optional; put WARDEN_ADMIN_PASSWORD=... in .env, else one is generated and logged)
      WARDEN_ADMIN_PASSWORD: ${WARDEN_ADMIN_PASSWORD:-}
      # Camera credentials referenced from config.yaml as ${CAM_USER} / ${CAM_PASS}
      CAM_USER: ${CAM_USER:-admin}
      CAM_PASS: ${CAM_PASS:-}
      WARDEN_WEB_HOST: 0.0.0.0
      WARDEN_WEB_PORT: 8080
      WARDEN_AUTH_ENABLED: "true"
      TZ: ${TZ:-UTC}
    # depends_on:
